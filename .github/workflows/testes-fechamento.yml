name: Testes do fechamento 21 para 15

on:
  pull_request:
    paths:
      - "scripts/fechamento_21.py"
      - "tests/test_fechamento_21.py"
      - ".github/workflows/testes-fechamento.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Executar testes
        run: python -m unittest discover -s tests -v
