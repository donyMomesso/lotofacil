name: Testes Cérebro Python Histórico

on:
  pull_request:
    paths:
      - "motor_python_v4/audit_core.py"
      - "motor_python_v4/checkpoint.py"
      - "motor_python_v4/api.py"
      - "motor_python_v4/test_audit_core.py"
      - "worker_python_bridge.js"
      - "aprendizado.html"
      - "index.html"
      - "wrangler.jsonc"
      - "tests/test_learning_server.mjs"
      - "tests/test_learning_index.js"
      - ".github/workflows/testes-aprendizado.yml"
      - ".github/workflows/checkpoint-python.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validar núcleo Python
        run: python -m py_compile motor_python_v4/audit_core.py motor_python_v4/checkpoint.py motor_python_v4/api.py
      - name: Testar checkpoints históricos
        working-directory: motor_python_v4
        run: python -m unittest -v test_audit_core.py
      - name: Validar Worker ponte
        run: node --input-type=module --check < worker_python_bridge.js
      - name: Testar Worker e painel
        run: node tests/test_learning_server.mjs
      - name: Testar acesso inicial
        run: node tests/test_learning_index.js
