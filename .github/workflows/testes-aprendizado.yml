name: Testes Champion Challenger

on:
  pull_request:
    paths:
      - "learning_audit_core.mjs"
      - "learning_governance.mjs"
      - "worker_learning.js"
      - "aprendizado.html"
      - "index.html"
      - "wrangler.jsonc"
      - "migrations/0002_aprendizado_historico.sql"
      - "migrations/0003_aprendizado_robustez.sql"
      - "migrations/0004_champion_challenger.sql"
      - "tests/test_learning_audit_core.mjs"
      - "tests/test_learning_governance.mjs"
      - "tests/test_learning_server.mjs"
      - "tests/test_learning_index.js"
      - ".github/workflows/testes-aprendizado.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validar núcleo histórico
        run: node --check learning_audit_core.mjs
      - name: Validar governança
        run: node --check learning_governance.mjs
      - name: Validar Worker envoltório
        run: node --input-type=module --check < worker_learning.js
      - name: Testar robustez estatística
        run: node tests/test_learning_audit_core.mjs
      - name: Testar Champion Challenger
        run: node tests/test_learning_governance.mjs
      - name: Testar D1 e painel
        run: node tests/test_learning_server.mjs
      - name: Testar acesso inicial
        run: node tests/test_learning_index.js
